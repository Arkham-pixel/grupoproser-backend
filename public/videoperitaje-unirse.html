    <style>

      }
      .torch { display: none; }
      body.in-call .torch {
        display: flex; position: absolute;
        right: calc(12px + env(safe-area-inset-right));

        background: rgba(255,255,255,.92); color: #111; align-items: center; justify-content: center;

      .client-loader {

      .capture-overlay {

      .capture-overlay.hidden { display: none !important; }
      .capture-box {
        background: rgba(24, 24, 27, .96); border: 1px solid rgba(255, 255, 255, .15);
        border-radius: 20px; padding: 26px 30px; text-align: center; color: #fff;

      .capture-icon { font-size: 40px; margin-bottom: 12px; display: inline-block; }

      .err { background: #fef2f2; color: #b91c1c; }

      .hint { color: #6b7280; font-size: 13px; line-height: 1.45; }
      body.in-call p.hint { display: none; }
      body.thanks { background: #0b1220; }
      body.thanks .wrap { max-width: none; margin: 0; padding: 0; height: 100%; }
      body.thanks .brand, body.thanks .tiny-brand { display: none; }
      .thanks-screen {
        min-height: 100dvh;

        flex-direction: column;

      }
      .thanks-rings {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thanks-rings::before,
      .thanks-rings::after {
        content: '';

        border: 2px solid rgba(200, 16, 46, 0.45);

      }
      .thanks-rings::after { animation-delay: 0.75s; }
      .thanks-icon {
        width: 86px;
        height: 86px;
        object-fit: contain;
        animation: thanks-pop 0.75s cubic-bezier(.2, 1.35, .35, 1) both, thanks-glow 2.4s ease-in-out 0.8s infinite;
      }
      .thanks-logo {
        width: min(250px, 74vw);
        margin: 18px 0 4px;
        animation: thanks-fadeup 0.7s ease 0.22s both;
      }
      .thanks-title {
        font-size: 34px;
        margin: 10px 0 8px;
        font-weight: 800;
        letter-spacing: -0.02em;
        animation: thanks-fadeup 0.7s ease 0.38s both;
      }
      .thanks-text {
        max-width: 320px;
        margin: 0;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.5;
        animation: thanks-fadeup 0.7s ease 0.52s both;
      }
      @keyframes thanks-pop {
        0% { transform: scale(0.35); opacity: 0; }
        65% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes thanks-ring {
        0% { transform: scale(0.55); opacity: 0.5; }
        100% { transform: scale(1.85); opacity: 0; }
      }
      @keyframes thanks-fadeup {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes thanks-glow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(200,16,46,.3)); }
        50% { filter: drop-shadow(0 0 22px rgba(200,16,46,.75)); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="brand">
        <p>Grupo Proser</p>
        <h1>Videoperitaje</h1>
      </header>
      <p class="tiny-brand">Grupo Proser · Videoperitaje</p>
      <div id="alert" class="hidden"></div>
      <div id="panel" class="card">
        Cargando…
        <p class="hint" id="load-hint" style="display:none;margin-top:12px">
          Si no avanza, toque el menú ⋮ y elija <strong>Abrir en Chrome</strong> o Safari (el navegador de WhatsApp a veces bloquea la videollamada).
        </p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var h = document.getElementById('load-hint');
        if (h) h.style.display = 'block';
      }, 7000);
    </script>
    <script>
      const token = decodeURIComponent((location.pathname.split('/videoperitaje/unirse/')[1] || '').split('/')[0] || '');
      function apiOrigin() {
        const host = location.hostname;
        if (host === 'arnald.grupoproser.com.co' || host === 'aplicacion.grupoproser.com.co') {
          return 'https://arnaldbackend.grupoproser.com.co';
        }
        return '';
      }
      const api = `${apiOrigin()}/api/videoperitaje/public/${encodeURIComponent(token)}`;
      const panel = document.getElementById('panel');
      const alertBox = document.getElementById('alert');
      let sesion = null;
      let stream = null;
      let liveRoom = null;
      let liveReconnectAttempts = 0;
      let watchTimer = null;
      let facingMode = 'environment';
      let torchOn = false;
      let callEnded = false;

      function showAlert(msg, ok) {
        if (!alertBox) return;
        alertBox.className = 'msg ' + (ok ? 'ok' : 'err');
        alertBox.style.display = 'block';
        alertBox.textContent = String(msg || '');
      }
      function hideAlert() {
        if (!alertBox) return;
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      }

      function sesionCerrada(s) {
        return s && (s.estado === 'finalizada' || s.estado === 'cancelada');
      }
      function stopWatch() {
        if (watchTimer) {
          clearInterval(watchTimer);
          watchTimer = null;
        }
      }
      function soltarCamara(room) {
        try {
          const p = room && room.localParticipant;
          if (!p) return;
          const stopPub = (pub) => {
            try { if (pub.track) pub.track.stop(); } catch (_) {}
            try {
              if (pub.track && pub.track.mediaStreamTrack) pub.track.mediaStreamTrack.stop();
            } catch (_) {}
          };
          if (p.videoTrackPublications) p.videoTrackPublications.forEach(stopPub);
          if (p.audioTrackPublications) p.audioTrackPublications.forEach(stopPub);
          try { p.setCameraEnabled(false); } catch (_) {}
          try { p.setMicrophoneEnabled(false); } catch (_) {}
        } catch (_) {}
      }
      function hangupLive() {
        document.body.classList.remove('in-call');
        stopWatch();
        if (liveRoom) {
          const room = liveRoom;
          liveRoom = null;
          soltarCamara(room);
          try { room.disconnect(); } catch (_) {}
        }
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        ['local', 'remote'].forEach((id) => {
          const el = document.getElementById(id);
          if (el && el.srcObject) {
            try { el.srcObject.getTracks().forEach((t) => t.stop()); } catch (_) {}
            el.srcObject = null;
          }
        });
      }
      function showEnded() {
        if (callEnded) return;
        callEnded = true;
        hangupLive();
        document.body.classList.remove('in-call');
        document.body.classList.add('thanks');
        const cancelada = sesion && sesion.estado === 'cancelada';
        const wrap = document.querySelector('.wrap');
        wrap.innerHTML = `
          <div class="thanks-screen">
            <div class="thanks-rings">
              <img class="thanks-icon" src="/arnald-icon.png" alt="Arnald" />
            </div>
            <img class="thanks-logo" src="/ArnaldDataFlow.png" alt="Arnald DataFlow" />
            <h2 class="thanks-title">${cancelada ? 'Sesión cerrada' : '¡Gracias!'}</h2>
            <p class="thanks-text">${
              cancelada
                ? 'El ajustador cerró esta videollamada. Ya puede salir.'
                : 'Gracias por atender el videoperitaje con Arnald DataFlow. Las evidencias quedaron en el expediente. Ya puede cerrar esta ventana.'
            }</p>
          </div>
        `;
      }
      function startWatch() {
        stopWatch();
        watchTimer = setInterval(async () => {
          try {
            await load();
            if (sesionCerrada(sesion)) showEnded();
          } catch (_) {}
        }, 2500);
      }

      function fitVideo(el) {
        if (!el) return;
        el.muted = true;
        const esPip = el.classList.contains('pip');
        el.style.objectFit = 'cover';
        el.style.objectPosition = 'center';
        // Sin espejo: lo que está a la derecha se ve a la derecha en todas las pantallas.
        el.style.transform = 'none';
        el.style.webkitTransform = 'none';
        if (esPip) {
          el.style.width = 'min(30vw, 120px)';
          el.style.height = 'auto';
          el.style.aspectRatio = '3 / 4';
          el.style.top = 'auto';
          el.style.left = 'auto';
          el.style.bottom = 'calc(16px + env(safe-area-inset-bottom))';
          el.style.right = 'calc(12px + env(safe-area-inset-right))';
          el.style.position = 'absolute';
          el.style.zIndex = '20';
          return;
        }
        el.style.width = '100%';
        el.style.height = '100%';
        el.style.minWidth = '100%';
        el.style.minHeight = '100%';
        el.style.top = '0';
        el.style.left = '0';
        el.style.right = '0';
        el.style.bottom = '0';
        el.style.margin = '0';
        el.style.position = 'absolute';
        el.style.zIndex = '1';
      }
      function cargarScript(src) {
        return new Promise(function (resolve) {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          const timer = setTimeout(function () { resolve(false); }, 20000);
          s.onload = function () { clearTimeout(timer); resolve(true); };
          s.onerror = function () { clearTimeout(timer); resolve(false); };
          document.head.appendChild(s);
        });
      }
      async function asegurarLivekit() {
        if (window.LivekitClient) return window.LivekitClient;
        const fuentes = [
          '/vendor/livekit-client-2.22.3.umd.js?r=' + Date.now(),
          'https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js',
          'https://unpkg.com/livekit-client@2.22.3/dist/livekit-client.umd.js',
        ];
        for (let i = 0; i < fuentes.length; i++) {
          await cargarScript(fuentes[i]);
          if (window.LivekitClient) return window.LivekitClient;
        }
        return null;
      }
      function esAndroid() {
        return /Android/i.test(navigator.userAgent || '');
      }
      function opcionesCamara() {
        return {
          facingMode: facingMode,
          resolution: { width: 1280, height: 960, aspectRatio: 4 / 3 },
        };
      }
      function opcionesPublicacion() {
        const P = window.LivekitClient && window.LivekitClient.VideoPresets;
        if (esAndroid()) return {};
        return {
          simulcast: true,
          videoCodec: 'vp8',
          videoSimulcastLayers: P ? [P.h1080, P.h720, P.h360] : undefined,
          audioPreset: { maxBitrate: 64000 },
        };
      }
      function videoConstraints() {
        return {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 960 },
          aspectRatio: { ideal: 4 / 3 },
          frameRate: { ideal: 30 },
        };
      }
      async function pedirCamara() {
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          throw new Error('Abra este enlace en Safari o Chrome (no en WhatsApp/Gmail).');
        }
        const intentos = [
          { video: videoConstraints(), audio: true },
          { video: { facingMode: { ideal: facingMode } }, audio: true },
          { video: true, audio: true },
          { video: true, audio: false },
        ];
        let stream = null;
        let lastErr = null;
        for (let i = 0; i < intentos.length; i++) {
          try {
            stream = await navigator.mediaDevices.getUserMedia(intentos[i]);
            if (stream) break;
          } catch (err) {
            lastErr = err;
          }
        }
        if (!stream) throw lastErr || new Error('Permita cámara y micrófono para continuar.');
        return stream;
      }
      function html(s) {
        return String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }
      async function load() {
        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
        let r;
        try {
          r = await fetch(api, ctrl ? { signal: ctrl.signal } : undefined);
        } catch (err) {
          if (timer) clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            throw new Error('La conexión tardó demasiado. Cierre WhatsApp y abra el enlace en Chrome o Safari.');
          }
          throw new Error('Sin conexión al servidor. Abra el enlace en Chrome o Safari (no en WhatsApp).');
        }
        if (timer) clearTimeout(timer);
        const text = await r.text();
        let j = {};
        try { j = text ? JSON.parse(text) : {}; } catch (_) {
          throw new Error('Respuesta inválida del servidor (' + r.status + ').');
        }
        if (!r.ok) throw new Error(j.error || ('No se pudo abrir la sesión (' + r.status + ')'));
        sesion = j.data;
        return sesion;
      }
      async function geo() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 8000 }
          );
        });
      }
      async function join() {
        const r = await fetch(`${api}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ geo: await geo() }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'No se pudo entrar');
        sesion = j.data;
        return j;
      }
      async function uploadBlob(blob, extra = {}) {
        const esVideo = extra.tipo === 'video' || String(blob.type || '').startsWith('video/');
        const name = extra.filename || (esVideo ? `grabacion-${Date.now()}.webm` : `foto-${Date.now()}.jpg`);
        const contentType = blob.type || (esVideo ? 'video/webm' : 'image/jpeg');
        try {
          const pre = await fetch(`${api}/uploads/presign`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: name,
              contentType,
              tipo: esVideo ? 'video' : 'foto',
              pasoId: extra.pasoId,
              descripcion: extra.descripcion,
              tamaño: blob.size,
            }),
          });
          const pj = await pre.json();
          if (pre.ok && pj.modo === 's3' && pj.uploadUrl) {
            const put = await fetch(pj.uploadUrl, {
              method: 'PUT',
              headers: pj.headers || { 'Content-Type': contentType },
              body: blob,
            });
            if (put.ok) {
              const done = await fetch(`${api}/uploads/completar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  key: pj.key,
                  filename: name,
                  contentType,
                  tamaño: blob.size,
                  tipo: esVideo ? 'video' : 'foto',
                  pasoId: extra.pasoId,
                  descripcion: extra.descripcion,
                }),
              });
              const dj = await done.json();
              if (!done.ok) throw new Error(dj.error || 'No se pudo registrar');
              return dj;
            }
          }
        } catch (_) { /* fallback proxy */ }
        const fd = new FormData();
        fd.append('archivo', blob, name);
        Object.entries(extra).forEach(([k, v]) => { if (v) fd.append(k, v); });
        if (esVideo) fd.append('tipo', 'video');
        const r = await fetch(`${api}/fotos`, { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'No se pudo subir la foto');
        sesion = j.data || sesion;
        return j;
      }
      function captureFrom(video) {
        if (!video || !video.videoWidth) return null;
        const srcW = video.videoWidth;
        const srcH = video.videoHeight;
        const largo = Math.max(srcW, srcH);
        const scale = largo > 4096 ? 4096 / largo : 1;
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(srcW * scale));
        c.height = Math.max(1, Math.round(srcH * scale));
        const ctx = c.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(video, 0, 0, c.width, c.height);
        return new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.95));
      }
      function pistaVideoLocal(room) {
        if (!room || !room.localParticipant) return null;
        const pubs = room.localParticipant.videoTrackPublications;
        if (!pubs) return null;
        const list = pubs.values ? Array.from(pubs.values()) : [];
        for (const pub of list) {
          const t = pub && pub.track && pub.track.mediaStreamTrack;
          if (t && t.kind === 'video' && t.readyState === 'live') return t;
        }
        return null;
      }
      function conTimeout(p, ms) {
        return Promise.race([
          p,
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
        ]);
      }
      async function captureFotoHd(video, track, opts) {
        const soloStream = opts && opts.soloStream;
        // takePhoto en muchos Android congela el MediaStream → pantalla negra en la llamada.
        // En vivo usamos solo frame del <video> / grabFrame.
        if (!soloStream && track && typeof ImageCapture === 'function') {
          try {
            const ic = new ImageCapture(track);
            if (ic.takePhoto) {
              let settings;
              try {
                const caps = await ic.getPhotoCapabilities();
                if (caps && caps.imageWidth && caps.imageHeight) {
                  settings = {
                    imageWidth: Math.min(1920, caps.imageWidth.max || 1920),
                    imageHeight: Math.min(2560, caps.imageHeight.max || 2560),
                  };
                }
              } catch (_) {}
              const raw = await conTimeout(
                settings ? ic.takePhoto(settings) : ic.takePhoto(),
                2800
              );
              if (raw && raw.size > 8000) {
                const tipo = String(raw.type || '');
                if (/^image\/(jpeg|jpg|png|webp)$/i.test(tipo) && raw.size < 12 * 1024 * 1024) {
                  return raw;
                }
                if (typeof createImageBitmap === 'function') {
                  const bmp = await createImageBitmap(raw);
                  const srcW = bmp.width;
                  const srcH = bmp.height;
                  const largo = Math.max(srcW, srcH);
                  const scale = largo > 4096 ? 4096 / largo : 1;
                  const c = document.createElement('canvas');
                  c.width = Math.max(1, Math.round(srcW * scale));
                  c.height = Math.max(1, Math.round(srcH * scale));
                  const ctx = c.getContext('2d', { alpha: false });
                  ctx.imageSmoothingEnabled = true;
                  ctx.imageSmoothingQuality = 'high';
                  ctx.drawImage(bmp, 0, 0, c.width, c.height);
                  if (bmp.close) bmp.close();
                  const blob = await new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.95));
                  if (blob && blob.size > 1500) return blob;
                }
              }
            }
          } catch (_) {}
        }
        if (track && typeof ImageCapture === 'function') {
          try {
            const ic = new ImageCapture(track);
            if (ic.grabFrame) {
              const frame = await ic.grabFrame();
              const srcW = frame.width;
              const srcH = frame.height;
              const largo = Math.max(srcW, srcH);
              const scale = largo > 4096 ? 4096 / largo : 1;
              const c = document.createElement('canvas');
              c.width = Math.max(1, Math.round(srcW * scale));
              c.height = Math.max(1, Math.round(srcH * scale));
              const ctx = c.getContext('2d', { alpha: false });
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(frame, 0, 0, c.width, c.height);
              if (frame.close) frame.close();
              const blob = await new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.95));
              if (blob && blob.size > 1500) return blob;
            }
          } catch (_) {}
        }
        return captureFrom(video);
      }
      async function recuperarVideoTrasCaptura() {
        const room = liveRoom;
        const localEl = document.getElementById('local');
        if (!room || !room.localParticipant) return;
        try {
          const pubs = Array.from(room.localParticipant.videoTrackPublications.values());
          const current = pubs.find(function (p) { return p.track; });
          if (current && current.track && current.track.restartTrack) {
            await current.track.restartTrack(opcionesCamara());
          }
          if (current && current.track && localEl) {
            current.track.attach(localEl);
            localEl.muted = true;
            localEl.setAttribute('playsinline', '');
            fitVideo(localEl);
            localEl.play().catch(function () {});
          }
        } catch (_) {
          try {
            await room.localParticipant.setCameraEnabled(false);
            await room.localParticipant.setCameraEnabled(true, opcionesCamara(), opcionesPublicacion());
            const pubs2 = Array.from(room.localParticipant.videoTrackPublications.values());
            const pub = pubs2.find(function (p) { return p.track; });
            if (pub && pub.track && localEl) {
              pub.track.attach(localEl);
              localEl.muted = true;
              fitVideo(localEl);
              localEl.play().catch(function () {});
            }
          } catch (__) {}
        }
      }
      function flashWhite() {
        let el = document.getElementById('flash');
        if (!el) {
          el = document.createElement('div');
          el.id = 'flash';
          el.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:80;pointer-events:none;display:none';
          document.body.appendChild(el);
        }
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 180);
      }
      async function tomarFotoHd() {
        const localEl = document.getElementById('local');
        const capOverlay = document.getElementById('capture-overlay');
        const capIcon = document.getElementById('capture-icon');
        const capTitle = document.getElementById('capture-title');
        const capDesc = document.getElementById('capture-desc');

        if (capOverlay) {
          if (capIcon) capIcon.textContent = '📸';
          if (capTitle) capTitle.textContent = 'Tomando fotografía...';
          if (capDesc) capDesc.textContent = 'Mantenga la cámara quieta';
          capOverlay.classList.remove('hidden');
        }

        let blob = null;
        try {
          // Trasera: foto del sensor para el informe. Frontal: cuadro del video, sin recorte de cara.
          blob = await captureFotoHd(localEl, pistaVideoLocal(liveRoom), {
            soloStream: facingMode !== 'environment',
          });
          flashWhite();
          if (blob) {
            if (capIcon) capIcon.textContent = '✅';
            if (capTitle) capTitle.textContent = '¡Foto capturada!';
            if (capDesc) capDesc.textContent = 'Puede continuar';
          } else if (capTitle) {
            capTitle.textContent = 'Error al capturar';
          }
        } catch (e) {
          if (capTitle) capTitle.textContent = 'Error al capturar';
        } finally {
          await recuperarVideoTrasCaptura();
          setTimeout(() => {
            if (capOverlay) capOverlay.classList.add('hidden');
          }, 900);
        }
        if (blob) subirFotoEnSegundoPlano(blob);
      }
      async function subirFotoEnSegundoPlano(blob) {
        for (let intento = 0; intento < 3; intento++) {
          try {
            await uploadBlob(blob, { descripcion: 'Captura videoperitaje' });
            return;
          } catch (_) {
            await new Promise(function (r) { setTimeout(r, 1500 * (intento + 1)); });
          }
        }
      }
      function renderWelcome() {
        panel.innerHTML = `
          <p>Hola${sesion.aseguradoNombre ? ' ' + html(sesion.aseguradoNombre) : ''}. Un ajustador de Grupo Proser lo espera${sesion.expediente ? ' para el expediente <strong>' + html(sesion.expediente) + '</strong>' : ''}.</p>
          <p class="hint">Es una videollamada. Permita cámara y micrófono. El ajustador tomará las fotos.</p>
          <button class="btn" id="entrar">Entrar a la videollamada</button>
        `;
        const entrarBtn = document.getElementById('entrar');
        entrarBtn.onclick = async () => {
          entrarBtn.disabled = true;
          entrarBtn.innerHTML = '<span class="mini-spin"></span> Conectando...';
          try {
            const joined = await join();
            if (sesion.tipo === 'guided') renderGuided();
            else renderLive(joined);
          } catch (e) {
            entrarBtn.disabled = false;
            entrarBtn.textContent = 'Entrar a la videollamada';
            showAlert(e.message);
          }
        };
      }
      async function renderLive(joined) {
        document.body.classList.add('in-call');
        hideAlert();
        facingMode = 'environment';
        panel.className = 'card';
        panel.innerHTML = `
          <div class="stage">
            <div id="client-loader" class="client-loader">
              <div class="loader-spinner"></div>
              <p class="loader-title">Conectando videollamada...</p>
              <p class="loader-sub">Iniciando cámara trasera...</p>
            </div>
            <div id="capture-overlay" class="capture-overlay hidden">
              <div class="capture-box">
                <div class="capture-icon" id="capture-icon">📸</div>
                <div class="capture-title" id="capture-title">Tomando fotografía...</div>
                <div class="capture-desc" id="capture-desc">Mantenga la cámara quieta</div>
              </div>
            </div>
            <video id="local" class="main" autoplay muted playsinline webkit-playsinline></video>
            <video id="remote" class="pip" autoplay muted playsinline webkit-playsinline></video>
            <p id="status" style="position:absolute;left:12px;top:80px;margin:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:5px 9px;border-radius:999px;z-index:5;">Esperando al ajustador…</p>
            <button type="button" class="torch" id="torch" aria-pressed="false">Flash apagado</button>
          </div>
        `;
        startWatch();
        const localEl = document.getElementById('local');
        const remoteEl = document.getElementById('remote');
        const status = document.getElementById('status');
        const hideLoader = () => {
          const l = document.getElementById('client-loader');
          if (l) l.classList.add('fade-out');
        };
        if (localEl) {
          localEl.addEventListener('playing', hideLoader, { once: true });
        }
        setTimeout(hideLoader, 3500);

        let previewStream = null;
        try {
          if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
            throw new Error('Abra este enlace en Safari o Chrome (no en Gmail).');
          }
          previewStream = await pedirCamara();
          if (localEl) {
            localEl.srcObject = previewStream;
            localEl.muted = true;
            localEl.setAttribute('playsinline', '');
            fitVideo(localEl);
            localEl.play().catch(function () {});
            hideLoader();
          }
        } catch (camErr) {
          const l = document.getElementById('client-loader');
          if (l) {
            l.innerHTML = `
              <div style="font-size:36px;margin-bottom:12px;">⚠️</div>
              <p class="loader-title">Permiso de cámara necesario</p>
              <p class="loader-sub">${html(camErr.message || 'Permita el acceso a la cámara en el navegador.')}</p>
              <button class="btn" onclick="location.reload()" style="margin-top:16px;max-width:200px;">Reintentar</button>
            `;
          }
          showAlert(camErr.message || 'Permita cámara y micrófono para continuar.');
        }
        const lk = joined && joined.livekit;
        let lkHost = '';
        try { lkHost = lk && lk.url ? new URL(lk.url).hostname : ''; } catch (e) { lkHost = ''; }
        const pagePublica = /\.grupoproser\.com\.co$/i.test(location.hostname);
        const lkPrivado = /^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.(1[6-9]|2\d|3[0-1])\.)/i.test(lkHost);
        if (!lk || !lk.token || !lk.url || (pagePublica && lkPrivado)) {
          const why = (lk && lk.error) || (pagePublica && lkPrivado
            ? 'El servidor de video no es público.'
            : 'Sin token de videollamada. Avise al ajustador.');
          if (status) status.textContent = why;
          showAlert(why);
          return;
        }
        try {
          const LivekitClient = await asegurarLivekit();
          if (!LivekitClient) throw new Error('No se pudo cargar la videollamada. Revise su conexión y recargue el enlace.');
          const room = new LivekitClient.Room({
            adaptiveStream: false,
            dynacast: true,
            stopLocalTrackOnUnpublish: true,
            disconnectOnPageLeave: false,
            reconnectPolicy: {
              nextRetryDelayInMs: function (ctx) {
                if (!ctx || ctx.retryCount > 14) return null;
                return Math.min(1000 * Math.pow(2, Math.min(ctx.retryCount, 3)), 8000);
              },
            },
            videoCaptureDefaults: opcionesCamara(),
            publishDefaults: opcionesPublicacion(),
          });
          liveRoom = room;
          const attachLocal = () => {
            room.localParticipant.videoTrackPublications.forEach((pub) => {
              if (!pub.track || !localEl) return;
              pub.track.attach(localEl);
              localEl.muted = true;
              localEl.setAttribute('playsinline', '');
              localEl.setAttribute('webkit-playsinline', '');
              fitVideo(localEl);
              const play = () => localEl.play().catch(() => {});
              if (localEl.readyState >= 2) play();
              else localEl.onloadedmetadata = play;
            });
          };
          room.on(LivekitClient.RoomEvent.LocalTrackPublished, attachLocal);
          room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, _pub, participant) => {
            if (participant.isLocal) return;
            if (track.kind === 'audio' || track.kind === LivekitClient.Track.Kind.Audio) {
              const audioEl = track.attach();
              if (audioEl) {
                audioEl.autoplay = true;
                audioEl.play && audioEl.play().catch(function () {});
              }
              if (room.startAudio) room.startAudio().catch(function () {});
            }
            if (track.kind === 'video' || track.kind === LivekitClient.Track.Kind.Video) {
              track.attach(remoteEl);
              remoteEl.muted = true;
              remoteEl.setAttribute('playsinline', '');
              remoteEl.setAttribute('webkit-playsinline', '');

            }
          });

          const unlockAudio = function () {
            if (room.startAudio) room.startAudio().catch(function () {});
          };
          document.body.addEventListener('click', unlockAudio, { passive: true });
          document.body.addEventListener('touchstart', unlockAudio, { passive: true });
          let reconnecting = false;
          room.on(LivekitClient.RoomEvent.Disconnected, async () => {
            soltarCamara(room);
            try { await load(); } catch (_) {}
            // Solo “gracias” si el ajustador finalizó/canceló. Un fallo de LiveKit no debe cerrar al cliente.
            if (sesionCerrada(sesion)) {
              showEnded();
              return;
            }
            if (previewStream && localEl) {
              localEl.srcObject = previewStream;
              localEl.muted = true;
              localEl.play().catch(function () {});
            }
            if (reconnecting || liveRoom !== room) return;
            if (liveReconnectAttempts >= 6) {
              if (status) status.textContent = 'Sin video. Recargue el enlace en Chrome o Safari.';
              showAlert('Se perdió la videollamada. Recargue el enlace.');
              return;
            }
            reconnecting = true;
            liveReconnectAttempts += 1;
            if (status) {
              status.style.display = '';
              status.textContent = 'Reconectando videollamada…';
            }
            try {
              const joined2 = await join();
              const lk2 = joined2 && joined2.livekit;
              if (lk2 && lk2.token && lk2.url) {

                try { room.disconnect(); } catch (_) {}

                liveReconnectAttempts = 0;
                return;
              }
            } catch (_) { /* reintento manual */ }
            reconnecting = false;
            if (status) status.textContent = 'Sin video. Toque Entrar de nuevo o recargue el enlace.';
            showAlert('Se perdió la videollamada. Recargue el enlace o pulse Entrar otra vez.');
          });
          let alCambiarCamara = null;
          let alAlternarFlash = null;
          room.on(LivekitClient.RoomEvent.DataReceived, async (payload, participant) => {
            if (participant && participant.isLocal) return;
            try {
              const msg = JSON.parse(new TextDecoder().decode(payload));
              if (msg && msg.type === 'CAPTURE') {
                room.localParticipant
                  .publishData(new TextEncoder().encode(JSON.stringify({ type: 'CAPTURE_ACK' })), { reliable: true })
                  .catch(function () {});
                await tomarFotoHd();
              }
              if (msg && msg.type === 'SWITCH_CAMERA' && alCambiarCamara) await alCambiarCamara();
              if (msg && msg.type === 'TORCH' && alAlternarFlash) await alAlternarFlash();
            } catch (_) {}
          });
          await room.connect(lk.url, lk.token, { peerConnectionTimeout: 30000 });
          try {
            if (room.startAudio) await room.startAudio();
          } catch (_) {}
          if (previewStream) {
            const vids = previewStream.getVideoTracks();
            const auds = previewStream.getAudioTracks();
            // Mic vía LiveKit (no amarrado al preview) para que no se corte.
            try {
              await room.localParticipant.setMicrophoneEnabled(true);

            }

            });
          } else {
            try { await room.localParticipant.setMicrophoneEnabled(true); } catch (_) {}

                const current = pubs.find((p) => p.track);
                if (current && current.track && current.track.restartTrack) {
                  await current.track.restartTrack(opcionesCamara());

          if (status) status.textContent = msg;
          showAlert(msg);
          if (previewStream && localEl) {
            localEl.srcObject = previewStream;
            localEl.muted = true;
            fitVideo(localEl);
            localEl.play().catch(function () {});
          }
        }
      }
      function renderGuided() {
        const pasos = sesion.pasos || [];
        const done = new Set(sesion.pasosCumplidos || []);
        const actual = pasos.find((p) => !done.has(p.id)) || pasos[pasos.length - 1];
        if (!actual) {
          panel.innerHTML = '<h2>Inspección completa</h2><p class="hint">Ya enviamos las fotos. Puede cerrar esta ventana.</p>';
          return;
        }
        const fotos = (sesion.medias || []).filter((m) => m.pasoId === actual.id).length;
        const idx = pasos.indexOf(actual) + 1;
        panel.innerHTML = `
          <p class="brand"><span style="color:#c8102e;font-size:12px;font-weight:700;">PASO ${idx} DE ${pasos.length}</span></p>
          <h2 style="margin:8px 0;">${html(actual.titulo)}</h2>
          <p class="hint">${html(actual.instruccion || '')}</p>
          <p class="hint">Fotos ${fotos}/${actual.maxFotos || 3} (mínimo ${actual.minFotos || 0})</p>
          <input id="file" type="file" accept="image/*" capture="environment" class="hidden" />
          <button class="btn" id="tomar">Tomar o subir foto</button>
          ${fotos >= (actual.minFotos || 0) ? '<button class="btn ghost" id="seguir">Continuar</button>' : ''}
        `;
        document.getElementById('tomar').onclick = () => document.getElementById('file').click();
        document.getElementById('file').onchange = async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          try {
            await uploadBlob(file, { pasoId: actual.id, descripcion: actual.titulo });
            await load();
            renderGuided();
            showAlert('Foto enviada', true);
          } catch (e) {
            showAlert(e.message);
          }
        };
        const seguir = document.getElementById('seguir');
        if (seguir) {
          seguir.onclick = async () => {
            try {
              const r = await fetch(`${api}/pasos/completar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pasoId: actual.id }),
              });
              const j = await r.json();
              if (!r.ok) throw new Error(j.error || 'No se pudo continuar');
              await load();
              renderGuided();
            } catch (e) {
              showAlert(e.message);
            }
          };
        }
      }

      (async () => {
        if (!token) {
          try { showAlert('Enlace incompleto'); } catch (_) {}
          if (panel) panel.innerHTML = '<p class="hint">Enlace incompleto. Pida un nuevo link al ajustador.</p>';
          return;
        }
        if (panel) panel.innerHTML = '<p class="hint">Cargando sesión…</p>';
        try {
          await load();
          if (sesionCerrada(sesion)) {
            showEnded();
            return;
          }
          renderWelcome();
        } catch (e) {
          var msg = (e && e.message) || 'No se pudo cargar la sesión';
          try { showAlert(msg); } catch (_) {}
          if (panel) {
            panel.innerHTML = '<p class="hint">' + html(msg) + '</p><p class="hint">Si abrió desde WhatsApp, toque ⋮ → Abrir en Chrome o Safari.</p>';
          }
        }
      })();
    </script>
